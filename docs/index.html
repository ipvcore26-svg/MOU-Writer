<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPV Ultra — Broker Term Sheet Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37;--gold-light:#e8cd6a;--gold-deep:#9a7b1e;
  --black:#0a0a0a;--d1:#111111;--d2:#1a1a1a;--d3:#222222;--d4:#2d2d2d;--d5:#383838;
  --text:#e8e0cc;--soft:#a09070;--line:#2a2a2a;--line2:#1e1e1e;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--black);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 8% 12%,rgba(212,175,55,.04) 0%,transparent 45%),radial-gradient(ellipse at 92% 88%,rgba(212,175,55,.03) 0%,transparent 45%);pointer-events:none;z-index:0;}

.app{display:flex;min-height:100vh;position:relative;z-index:1;}

/* SIDEBAR */
.sidebar{width:256px;flex-shrink:0;background:var(--d1);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;}
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid var(--line);}
.logo-row{display:flex;align-items:center;gap:10px;}
.logo-badge{width:30px;height:30px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:11px;color:var(--black);flex-shrink:0;}
.logo-text h1{font-family:'Playfair Display',serif;font-size:12.5px;font-weight:600;color:var(--gold);line-height:1.2;}
.logo-text p{font-size:10px;color:var(--soft);margin-top:1px;}
.sb-prog{padding:13px 18px;border-bottom:1px solid var(--line);}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.prog-row span:first-child{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);}
.prog-row span:last-child{font-size:10.5px;font-weight:600;color:var(--gold);}
.prog-bar{height:2px;background:var(--d4);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--gold);transition:width .4s;}
.prog-sub{font-size:9.5px;color:var(--soft);margin-top:4px;}
.sb-nav{flex:1;padding:8px;overflow-y:auto;}
.nav-btn{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:3px;margin-bottom:1px;background:none;border:none;cursor:pointer;transition:all .15s;color:var(--soft);font-size:11px;font-family:'Inter',sans-serif;}
.nav-btn:hover{background:var(--d3);color:var(--text);}
.nav-btn.active{background:var(--d3);border:1px solid rgba(212,175,55,.25);color:var(--gold);}
.nav-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-right:7px;background:var(--d5);}
.nav-dot.part{background:var(--gold-deep);}
.nav-dot.full{background:var(--gold);}
.nav-lbl{flex:1;}
.nav-ct{font-size:9.5px;color:var(--soft);}
.sb-foot{padding:12px 18px;border-top:1px solid var(--line);}
.sb-foot a{font-size:10.5px;color:var(--soft);text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .15s;}
.sb-foot a:hover{color:var(--gold);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;}
.tb-left h2{font-family:'Playfair Display',serif;font-size:17px;font-weight:500;color:var(--gold);}
.tb-left p{font-size:10.5px;color:var(--soft);margin-top:1px;}
.tb-right{display:flex;align-items:center;gap:8px;}
.btn-ghost{background:none;border:1px solid var(--d5);color:var(--soft);padding:6px 13px;border-radius:3px;font-size:11px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-gen{display:flex;align-items:center;gap:6px;background:var(--gold);color:var(--black);border:none;padding:8px 18px;border-radius:3px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;letter-spacing:.02em;}
.btn-gen:hover{background:var(--gold-light);}
.btn-gen:disabled{opacity:.5;cursor:not-allowed;}

.alert{display:none;margin:14px 28px 0;padding:9px 13px;border-radius:3px;font-size:11.5px;align-items:center;gap:7px;}
.alert.show{display:flex;}
.al-ok{background:rgba(74,124,89,.15);border:1px solid rgba(74,124,89,.35);color:#80b88e;}
.al-err{background:rgba(139,58,58,.15);border:1px solid rgba(139,58,58,.35);color:#c08080;}
.alert svg{width:13px;height:13px;flex-shrink:0;}
.al-act{margin-left:auto;}
.btn-again{background:none;border:1px solid rgba(74,124,89,.5);color:#80b88e;padding:3px 9px;border-radius:2px;font-size:10.5px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;}
.btn-again:hover{background:rgba(74,124,89,.12);}

.form-body{padding:20px 28px 48px;overflow-y:auto;flex:1;}
.sec-card{background:var(--d1);border:1px solid var(--line);border-radius:3px;padding:20px 22px;margin-bottom:16px;scroll-margin-top:76px;transition:border-color .15s;}
.sec-card:hover{border-color:var(--d5);}
.sec-title{font-family:'Playfair Display',serif;font-size:14px;font-weight:500;color:var(--gold);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;}
.sec-title::before{content:'';width:3px;height:14px;background:var(--gold);flex-shrink:0;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.fg5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.f-full{grid-column:1/-1;}
.fgrp{display:flex;flex-direction:column;gap:3px;}
.flbl{font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-deep);display:flex;align-items:center;gap:4px;}
.fnum{color:var(--d5);font-size:8.5px;}
.fchk{color:var(--gold);}
.finp{width:100%;background:var(--d2);border:1px solid var(--d4);border-radius:2px;padding:7px 9px;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;transition:all .15s;outline:none;}
.finp:focus{border-color:var(--gold);background:var(--d1);}
.finp::placeholder{color:var(--d5);}
textarea.finp{resize:vertical;min-height:54px;}
.slab-hdr{font-size:9.5px;color:var(--soft);text-align:center;padding:3px 0;border-bottom:1px solid var(--line);margin-bottom:1px;}

/* PREVIEW */
.preview{width:248px;flex-shrink:0;background:var(--d1);border-left:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;}
.pv-head{padding:15px 16px;border-bottom:1px solid var(--line);}
.pv-head h3{font-family:'Playfair Display',serif;font-size:12.5px;font-weight:500;color:var(--gold);}
.pv-head p{font-size:9.5px;color:var(--soft);margin-top:2px;}
.pv-body{padding:13px 16px;display:flex;flex-direction:column;gap:13px;}
.pv-sec-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-deep);margin-bottom:6px;}
.pv-row{display:flex;gap:5px;padding:3px 0;border-bottom:1px solid var(--line2);font-size:10.5px;}
.pv-row:last-child{border-bottom:none;}
.pv-k{color:var(--soft);width:82px;flex-shrink:0;line-height:1.4;}
.pv-v{color:var(--text);flex:1;word-break:break-word;line-height:1.4;}
.pv-mt{color:var(--d5);font-style:italic;}
.doc-card{border:1px solid rgba(212,175,55,.15);border-radius:3px;padding:14px;background:var(--d2);text-align:center;margin-top:2px;}
.doc-icon{width:32px;height:32px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);border-radius:2px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}
.doc-icon svg{width:16px;height:16px;}
.doc-name{font-family:'Playfair Display',serif;font-size:11.5px;color:var(--text);}
.doc-dt{font-size:9.5px;color:var(--soft);margin-top:2px;}

.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.25);border-top-color:var(--black);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

@media(max-width:1120px){.preview{display:none;}}
@media(max-width:780px){.sidebar{display:none;}.fg{grid-template-columns:1fr;}.fg5{grid-template-columns:1fr 1fr;}.topbar{padding:11px 14px;}.form-body{padding:14px;}}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="sb-logo">
    <div class="logo-row">
      <div class="logo-badge">IPV</div>
      <div class="logo-text"><h1>IPV Ultra</h1><p>Term Sheet Generator</p></div>
    </div>
  </div>
  <div class="sb-prog">
    <div class="prog-row"><span>Completion</span><span id="pct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="pbar" style="width:0%"></div></div>
    <div class="prog-sub" id="psub">0 / 48 fields</div>
  </div>
  <nav class="sb-nav" id="nav"></nav>
  <div class="sb-foot">
    <a href="https://github.com/ipvcore26-svg/mou-writer" target="_blank">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      Source on GitHub
    </a>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="tb-left">
      <h2>Broker Referral Term Sheet</h2>
      <p>IPV Ultra &nbsp;·&nbsp; Binding Referral Agreement Generator</p>
    </div>
    <div class="tb-right">
      <button class="btn-ghost" onclick="clearDraft()">Clear Draft</button>
      <button class="btn-gen" id="genBtn" onclick="generate()">
        <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Generate Document
      </button>
    </div>
  </div>

  <div class="alert al-ok" id="alOk">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    <span>Document generated — your download has started.</span>
    <div class="al-act"><button class="btn-again" onclick="generate()">Download Again</button></div>
  </div>
  <div class="alert al-err" id="alErr">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span id="errMsg">Error</span>
  </div>

  <div class="form-body" id="formBody"></div>
</div>

<aside class="preview">
  <div class="pv-head"><h3>Live Preview</h3><p>Key field summary</p></div>
  <div class="pv-body" id="pvBody"></div>
</aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.47.0/build/docxtemplater.js"></script>
<script>
const SECTIONS=[
  {id:'execution',label:'A. Execution Details',slab:false,fields:[
    {n:1,label:'Execution Date',type:'date'}
  ]},
  {id:'consultant',label:'B. Consultant Details',slab:false,fields:[
    {n:2,label:'Consultant Entity Name',type:'text'},
    {n:3,label:'LLP IN / CIN',type:'text'},
    {n:4,label:'Contact Person Name',type:'text'},
    {n:5,label:'Contact Person Address',type:'textarea'},
    {n:6,label:'Contact Person Email',type:'email'},
    {n:7,label:'Contact Person Phone',type:'tel'},
  ]},
  {id:'manager',label:'C. Investment Manager',slab:false,fields:[
    {n:8,label:'IPV Phone — Chaitanya (+91)',type:'tel',ph:'e.g. 9876543210'},
    {n:9,label:'IPV Office Email',type:'email'},
  ]},
  {id:'ultra-a',label:'D. IPV Ultra A',slab:false,fields:[
    {n:10,label:'Management Fee %',type:'text',ph:'e.g. 2'},
    {n:11,label:'Charged for (Years)',type:'text',ph:'e.g. 3'},
    {n:12,label:'Profit Sharing — Carry',type:'text',ph:'e.g. 20%'},
    {n:13,label:'Hurdle Rate',type:'text',ph:'e.g. 8% p.a.'},
    {n:14,label:'Min Ticket (INR)',type:'text',ph:'e.g. 25,00,000'},
    {n:15,label:'1st Drawdown (INR)',type:'text',ph:'e.g. 6,25,000'},
    {n:16,label:'2nd Drawdown (INR)',type:'text'},
    {n:17,label:'3rd Drawdown (INR)',type:'text'},
    {n:18,label:'4th Drawdown (INR)',type:'text'},
  ]},
  {id:'ultra-b',label:'E. IPV Ultra B',slab:false,fields:[
    {n:19,label:'Management Fee',type:'text',ph:'e.g. 2% p.a.'},
    {n:20,label:'Charged for (Years)',type:'text'},
    {n:21,label:'Profit Sharing — Carry',type:'text'},
    {n:22,label:'Hurdle Rate',type:'text'},
    {n:23,label:'Min Ticket (INR)',type:'text'},
    {n:24,label:'1st Drawdown (INR)',type:'text'},
    {n:25,label:'2nd Drawdown (INR)',type:'text'},
    {n:26,label:'3rd Drawdown (INR)',type:'text'},
    {n:27,label:'4th Drawdown (INR)',type:'text'},
  ]},
  {id:'slabs',label:'F. Contribution Slabs (INR Cr)',slab:true,fields:[
    {n:28,label:'Slab 1',type:'text',ph:'e.g. 0.25'},
    {n:29,label:'Slab 2',type:'text'},
    {n:30,label:'Slab 3',type:'text'},
    {n:31,label:'Slab 4',type:'text'},
    {n:32,label:'Slab 5',type:'text'},
  ]},
  {id:'fee25',label:'G. Fee Share — ₹25L to ₹50L',slab:true,fields:[
    {n:33,label:'Slab 1 %',type:'text'},
    {n:34,label:'Slab 2 %',type:'text'},
    {n:35,label:'Slab 3 %',type:'text'},
    {n:36,label:'Slab 4 %',type:'text'},
    {n:37,label:'Slab 5 %',type:'text'},
  ]},
  {id:'fee50',label:'H. Fee Share — ₹50L+',slab:true,fields:[
    {n:38,label:'Slab 1 %',type:'text'},
    {n:39,label:'Slab 2 %',type:'text'},
    {n:40,label:'Slab 3 %',type:'text'},
    {n:41,label:'Slab 4 %',type:'text'},
    {n:42,label:'Slab 5 %',type:'text'},
  ]},
  {id:'excl',label:'I. Exclusivity',slab:false,fields:[
    {n:43,label:'Exclusivity Region',type:'text',ph:'e.g. Delhi NCR'},
    {n:44,label:'Exclusivity End Date',type:'date'},
    {n:45,label:'Min AUM / Month (₹)',type:'text',ph:'e.g. 50,00,000'},
    {n:46,label:'Quarterly AUM Threshold (₹)',type:'text'},
  ]},
  {id:'validity',label:'J. Validity & Signatory',slab:false,fields:[
    {n:47,label:'Validity Period (Years)',type:'text',ph:'e.g. 1'},
    {n:48,label:'Consultant Signatory Name',type:'text'},
  ]},
];

const SK='ipv_ts_v2';
let V={};
try{const s=localStorage.getItem(SK);if(s)V=JSON.parse(s);}catch(e){}

const LABELS={};
SECTIONS.forEach(s=>s.fields.forEach(f=>{LABELS[f.n]=f.label;}));

function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function buildForm(){
  const body=document.getElementById('formBody');
  body.innerHTML='';
  SECTIONS.forEach(sec=>{
    const card=document.createElement('div');
    card.className='sec-card';card.id=sec.id;
    card.innerHTML=`<div class="sec-title">${e(sec.label)}</div>`;
    const grid=document.createElement('div');
    grid.className=sec.slab?'fg5':'fg';
    if(sec.slab){
      sec.fields.forEach(f=>{
        const h=document.createElement('div');h.className='slab-hdr';h.textContent=e(f.label);grid.appendChild(h);
      });
    }
    sec.fields.forEach(f=>{
      const key='field'+f.n;
      const isTA=f.type==='textarea';
      const g=document.createElement('div');
      g.className='fgrp'+(isTA&&!sec.slab?' f-full':'');
      const val=V[key]||'';
      const ph=e(f.ph||('Enter '+f.label.toLowerCase()));
      g.innerHTML=`<label class="flbl" for="${key}"><span class="fnum">#${f.n}</span>${e(f.label)}${val.trim()?'<span class="fchk">✓</span>':''}</label>`
        +(isTA
          ?`<textarea id="${key}" class="finp" placeholder="${ph}" rows="2">${e(val)}</textarea>`
          :`<input id="${key}" type="${f.type}" class="finp" placeholder="${ph}" value="${e(val)}">`);
      grid.appendChild(g);
    });
    card.appendChild(grid);
    body.appendChild(card);
  });
  document.querySelectorAll('.finp').forEach(el=>el.addEventListener('input',onInput));
}

function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='';
  SECTIONS.forEach(sec=>{
    const btn=document.createElement('button');
    btn.className='nav-btn';btn.id='nb-'+sec.id;
    btn.onclick=()=>document.getElementById(sec.id)?.scrollIntoView({behavior:'smooth',block:'start'});
    const filled=sec.fields.filter(f=>(V['field'+f.n]||'').trim()).length;
    const total=sec.fields.length;
    const dc=filled===total&&total>0?'full':filled>0?'part':'';
    btn.innerHTML=`<div class="nav-dot ${dc}"></div><span class="nav-lbl">${e(sec.label)}</span><span class="nav-ct">${filled}/${total}</span>`;
    nav.appendChild(btn);
  });
}

function buildPreview(){
  const pvSecs=[
    {t:'Execution & Consultant',ns:[1,2,3,4,6]},
    {t:'IPV Ultra A',ns:[10,11,12,13,14]},
    {t:'IPV Ultra B',ns:[19,20,21,22,23]},
    {t:'Slabs & Fee',ns:[28,29,33,38]},
    {t:'Exclusivity & Validity',ns:[43,44,47,48]},
  ];
  let html='';
  pvSecs.forEach(ps=>{
    html+=`<div><div class="pv-sec-title">${e(ps.t)}</div>`;
    ps.ns.forEach(n=>{
      const v=V['field'+n]||'';
      html+=`<div class="pv-row"><span class="pv-k">${e(LABELS[n]||'')}</span><span class="pv-v">${v?e(v):'<span class="pv-mt">—</span>'}</span></div>`;
    });
    html+='</div>';
  });
  const nm=V.field2||'Broker Term Sheet';
  const dt=V.field1||'';
  html+=`<div class="doc-card"><div class="doc-icon"><svg fill="none" stroke="#d4af37" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div><div class="doc-name">${e(nm)}</div><div class="doc-dt">${dt?'Dated: '+e(dt):'Date not set'}</div></div>`;
  document.getElementById('pvBody').innerHTML=html;
}

function updateProgress(){
  const filled=Object.values(V).filter(v=>(v||'').trim()).length;
  const pct=Math.round(filled/48*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('psub').textContent=filled+' / 48 fields';
}

function onInput(ev){
  const key=ev.target.id;
  V[key]=ev.target.value;
  try{localStorage.setItem(SK,JSON.stringify(V));}catch(x){}
  updateProgress();buildNav();buildPreview();
  // inline checkmark
  const lbl=ev.target.previousElementSibling;
  if(lbl&&lbl.classList.contains('flbl')){
    let chk=lbl.querySelector('.fchk');
    if(ev.target.value.trim()){if(!chk){chk=document.createElement('span');chk.className='fchk';chk.textContent='✓';lbl.appendChild(chk);}}
    else{if(chk)chk.remove();}
  }
}

function clearDraft(){
  if(!confirm('Clear all draft data?'))return;
  V={};localStorage.removeItem(SK);
  buildForm();buildNav();buildPreview();updateProgress();
}

// Active nav via IntersectionObserver
function watchSections(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
        document.getElementById('nb-'+en.target.id)?.classList.add('active');
      }
    });
  },{threshold:.2,rootMargin:'-76px 0px 0px 0px'});
  SECTIONS.forEach(s=>{const el=document.getElementById(s.id);if(el)obs.observe(el);});

function b64ToArr(b64){const bin=atob(b64);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf;}

function generate(){
  document.getElementById('alOk').classList.remove('show');
  document.getElementById('alErr').classList.remove('show');
  const btn=document.getElementById('genBtn');
  const orig=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<div class="spin"></div> Generating…';
  setTimeout(()=>{
    try{
      const zip=new PizZip(b64ToArr(TMPL));
      const doc=new window.docxtemplater(zip,{paragraphLoop:true,linebreaks:true,delimiters:{start:'{{',end:'}}'}});
      const data={};
      for(let i=1;i<=48;i++)data['field'+i]=V['field'+i]||'';
      doc.render(data);
      const blob=doc.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      const fname=(V.field2?'IPV_Ultra_'+V.field2.replace(/\s+/g,'_'):'IPV_Ultra_Term_Sheet')+'.docx';
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=fname;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),15000);
      document.getElementById('alOk').classList.add('show');
    }catch(err){
      document.getElementById('errMsg').textContent=err.message||'Generation failed';
      document.getElementById('alErr').classList.add('show');
      console.error(err);
    }finally{btn.disabled=false;btn.innerHTML=orig;}
  },50);
}

buildForm();buildNav();buildPreview();updateProgress();watchSections();
