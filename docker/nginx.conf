server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BACKEND_URL is injected at container start via envsubst.
    # Docker Compose default: http://backend:3001
    # Render / cloud: set BACKEND_URL env var to the backend service URL.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
